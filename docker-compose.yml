services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    # ports убраны: БД нужна только pipeline внутри сети compose.
    # Если нужен доступ с хоста, используйте "5433:5432", так как 5432 занят taxi-kz.
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
        - "5432:5432"  # <-- ДОБАВИЛИ ЭТУ СТРОКУ
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      N_PRICES: ${N_PRICES:-300000}
      AS_OF_DATE: ${AS_OF_DATE:-2026-10-26}
      ETL_START_DATE: ${ETL_START_DATE:-2000-01-01}
      ETL_END_DATE: ${ETL_END_DATE:-2100-01-01}
      DQ_RUB_MIN_PRICE: ${DQ_RUB_MIN_PRICE:-1000}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      RUN_ML: ${RUN_ML:-1}
      RUN_TESTS: ${RUN_TESTS:-1}
    volumes:
      - ./artifacts:/app/artifacts

volumes:
  pgdata:
